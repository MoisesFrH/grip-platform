<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ND Neurodiversa — Registro de consulta inicial</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root { --primary:#1d3375; --accent:#e87722; --bg:#f4f6fb; --card:#fff; --line:#d5dbea; --muted:#5b6585; --ok:#1f7a4d; --err:#b3261e; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:#1b2142; font-family:"Plus Jakarta Sans",system-ui,sans-serif; line-height:1.45; }
  header { background:var(--primary); color:#fff; padding:18px 20px; }
  header .brand { font-size:.8rem; opacity:.8; letter-spacing:.04em; text-transform:uppercase; }
  header h1 { margin:4px 0 0; font-size:1.25rem; }
  .badge { display:inline-block; margin-top:8px; background:var(--accent); color:#fff; border-radius:999px; padding:2px 12px; font-size:.78rem; font-weight:600; }
  main { max-width:820px; margin:0 auto; padding:16px 14px 90px; }
  .notice { background:#fff7ee; border:1px solid #f3cfaa; border-radius:12px; padding:12px 14px; font-size:.86rem; margin-bottom:14px; }
  .notice.err { background:#fdecea; border-color:#f1b5b0; color:var(--err); }
  section.card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  section.card h2 { margin:0 0 12px; font-size:1rem; color:var(--primary); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px 14px; }
  .field.wide { grid-column:1/-1; }
  label.lbl { display:block; font-size:.78rem; font-weight:600; color:var(--muted); margin-bottom:4px; }
  input[type=text], input[type=number], input[type=date], textarea { width:100%; padding:10px 11px; border:1px solid var(--line); border-radius:9px; font:inherit; font-size:.95rem; background:#fff; }
  textarea { min-height:78px; resize:vertical; }
  input:focus, textarea:focus { outline:2px solid #9db2f0; border-color:#9db2f0; }
  .opts { display:flex; flex-wrap:wrap; gap:8px; }
  .opts label { display:inline-flex; align-items:center; gap:7px; padding:8px 13px; border:1px solid var(--line); border-radius:999px; font-size:.9rem; cursor:pointer; background:#fff; }
  .opts label:has(input:checked) { background:#e3eaff; border-color:var(--primary); font-weight:600; }
  .opts input { accent-color:var(--primary); }
  .bar { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line); padding:10px 14px; display:flex; gap:10px; justify-content:center; }
  button { font:inherit; font-weight:600; border-radius:10px; padding:11px 22px; border:1px solid var(--primary); background:var(--primary); color:#fff; cursor:pointer; }
  button.sec { background:#fff; color:var(--primary); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .done { text-align:center; padding:40px 10px; }
  .done h2 { color:var(--ok); }
  @media print { header, .bar, .notice { display:none; } body { background:#fff; } }
</style>
</head>
<body>
<header>
  <div class="brand">ND Neurodiversa</div>
  <h1 id="title">Registro de consulta inicial infantil</h1>
  <span class="badge" id="badge"></span>
</header>
<main id="main"><div class="notice">Cargando…</div></main>
<div class="bar" id="bar" hidden>
  <button class="sec" type="button" id="back-btn">Volver al CRM</button>
  <button type="button" id="save-btn">Guardar registro</button>
</div>

<script>
(function () {
  var BADGES = { PATRONATO: "Patronato Sordomudo", SENASA: "Programa Senasa Integra", DIRECT: "Paciente privado" };
  var slug = location.pathname.split("/").filter(Boolean).pop();
  var params = new URLSearchParams(location.search);
  var contactId = params.get("contact");
  var main = document.getElementById("main");
  var schema = null;

  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === "class") n.className = attrs[k]; else if (k === "text") n.textContent = attrs[k]; else n.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { n.appendChild(c); });
    return n;
  }
  function notice(msg, isErr) { main.innerHTML = ""; main.appendChild(el("div", { class: "notice" + (isErr ? " err" : ""), text: msg })); }

  function renderField(f) {
    var wrap = el("div", { class: "field" + (f.kind === "textarea" || f.kind === "multi" || f.kind === "choice" ? " wide" : "") });
    wrap.appendChild(el("label", { class: "lbl", text: f.label + (f.required ? " *" : "") }));
    if (f.kind === "textarea") {
      wrap.appendChild(el("textarea", { "data-key": f.key }));
    } else if (f.kind === "yesno" || f.kind === "choice" || f.kind === "multi") {
      var options = f.kind === "yesno" ? ["Sí", "No"] : f.options;
      var box = el("div", { class: "opts", "data-key": f.key, "data-kind": f.kind });
      options.forEach(function (o) {
        var input = el("input", { type: f.kind === "multi" ? "checkbox" : "radio", name: f.key, value: o });
        box.appendChild(el("label", {}, [input, el("span", { text: o })]));
      });
      wrap.appendChild(box);
    } else {
      wrap.appendChild(el("input", { type: f.kind === "number" ? "number" : f.kind === "date" ? "date" : "text", "data-key": f.key, step: "any" }));
    }
    return wrap;
  }

  function collect() {
    var answers = {};
    main.querySelectorAll("[data-key]").forEach(function (n) {
      var key = n.getAttribute("data-key"), kind = n.getAttribute("data-kind");
      if (kind === "multi") {
        answers[key] = Array.prototype.map.call(n.querySelectorAll("input:checked"), function (i) { return i.value; });
      } else if (kind) {
        var c = n.querySelector("input:checked"); answers[key] = c ? c.value : "";
      } else { answers[key] = n.value; }
    });
    return answers;
  }

  async function call(path, opts) {
    var res = await fetch(path, Object.assign({ credentials: "include", headers: { "Content-Type": "application/json" } }, opts || {}));
    if (res.status === 401) { var e = new Error("login"); e.login = true; throw e; }
    var data = null; try { data = await res.json(); } catch (x) {}
    if (!res.ok) throw new Error((data && data.detail) || "Ocurrió un error.");
    return data;
  }

  function goBack() { location.href = "/crm"; }
  document.getElementById("back-btn").addEventListener("click", goBack);

  document.getElementById("save-btn").addEventListener("click", async function () {
    var btn = this; btn.disabled = true;
    try {
      await call("/crm/forms", { method: "POST", body: JSON.stringify({ form_type: schema.form_type, contact_id: contactId, answers: collect() }) });
      main.innerHTML = "";
      main.appendChild(el("div", { class: "done" }, [el("h2", { text: "Registro guardado" }), el("p", { text: "Ya aparece en la ficha del paciente, en el CRM." })]));
      document.getElementById("save-btn").hidden = true;
      document.getElementById("back-btn").textContent = "Ir al CRM";
      window.scrollTo(0, 0);
    } catch (e) {
      btn.disabled = false;
      alert(e.message);
    }
  });

  (async function init() {
    try {
      schema = await call("/crm/forms/schema/" + encodeURIComponent(slug));
    } catch (e) {
      if (e.login) return notice("Inicia sesión en el CRM (/crm) y vuelve a abrir este formulario.", true);
      return notice(e.message, true);
    }
    document.getElementById("title").textContent = schema.title.split(" — ")[0];
    document.getElementById("badge").textContent = BADGES[schema.form_type] || "";
    main.innerHTML = "";
    main.appendChild(el("div", { class: "notice", text: contactId
      ? "Este formulario contiene información confidencial sobre el manejo emocional y datos personales del paciente. Escribir lo más claro posible."
      : "Vista previa: para guardar respuestas, abre este formulario desde la ficha del paciente en el CRM." }));
    schema.sections.forEach(function (sec) {
      var card = el("section", { class: "card" }, [el("h2", { text: sec.title })]);
      var grid = el("div", { class: "grid" });
      sec.fields.forEach(function (f) { grid.appendChild(renderField(f)); });
      card.appendChild(grid); main.appendChild(card);
    });
    document.getElementById("bar").hidden = false;
    if (!contactId) document.getElementById("save-btn").disabled = true;
  })();
})();
</script>
</body>
</html>
