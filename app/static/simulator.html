<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GRIP — Simulador (sin Twilio)</title>
<style>
  :root {
    --bg: #f0f2f5;
    --panel: #ffffff;
    --border: #e2e5e9;
    --bot: #e9edf1;
    --patient-bubble: #dcf8c6;
    --agent-bubble: #d6e8ff;
    --muted: #6b7280;
    --accent: #128c7e;
    --wa-header: #075e54;
    --wa-panel: #f0f2f5;
    --wa-chat-bg: #e5ddd5;
    --wa-out-bubble: #dcf8c6;
    --wa-in-bubble: #ffffff;
    --wa-tick-read: #34b7f1;
    --danger: #c0392b;
    --warn: #b7791f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: #1f2430;
  }
  header {
    background: var(--accent);
    color: white;
    padding: 10px 16px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header .sub {
    font-weight: 400;
    font-size: 0.8rem;
    opacity: 0.9;
  }
  .layout {
    display: flex;
    height: calc(100vh - 46px);
  }
  .pane {
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  .pane-left {
    flex: 1;
    max-width: 420px;
    border-right: 1px solid var(--border);
    background: var(--wa-panel);
    align-items: center;
    padding: 16px 0;
    overflow-y: auto;
  }
  .pane-right {
    flex: 1.4;
    display: flex;
  }
  .pane-title {
    padding: 10px 14px;
    font-size: 0.85rem;
    font-weight: 600;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  /* --- simulator controls (not part of the WhatsApp look-alike) --- */
  .sim-controls {
    width: 300px;
    max-width: 90%;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-bottom: 14px;
    font-size: 0.78rem;
  }
  .sim-controls label {
    color: var(--muted);
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    display: block;
    margin-bottom: 2px;
  }
  .sim-controls input {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.8rem;
  }
  .sim-controls button {
    padding: 6px 10px;
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.75rem;
    white-space: nowrap;
    align-self: flex-end;
  }

  /* --- phone mockup --- */
  .phone-frame {
    width: 300px;
    max-width: 90%;
    height: 640px;
    max-height: 78vh;
    background: #111;
    border-radius: 34px;
    padding: 10px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
    flex-shrink: 0;
  }
  .phone-screen {
    background: var(--wa-chat-bg);
    width: 100%;
    height: 100%;
    border-radius: 24px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .phone-notch {
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 90px;
    height: 16px;
    background: #111;
    border-radius: 10px;
    z-index: 5;
  }
  .wa-status-bar {
    height: 30px;
    background: var(--wa-header);
    flex-shrink: 0;
  }
  .wa-header {
    background: var(--wa-header);
    color: white;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px 12px;
    flex-shrink: 0;
  }
  .wa-header .back-arrow { font-size: 1.1rem; opacity: 0.9; }
  .wa-avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #ffffff33;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.85rem;
    flex-shrink: 0;
  }
  .wa-header .who { flex: 1; min-width: 0; }
  .wa-header .name {
    font-size: 0.92rem;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .wa-header .status {
    font-size: 0.68rem;
    opacity: 0.85;
  }
  .wa-header .icons {
    display: flex;
    gap: 14px;
    font-size: 0.95rem;
    opacity: 0.9;
  }

  .chat-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 12px 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .bubble {
    max-width: 80%;
    padding: 6px 8px 6px 9px;
    border-radius: 8px;
    font-size: 0.85rem;
    line-height: 1.33;
    white-space: pre-wrap;
    word-wrap: break-word;
    box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
    position: relative;
  }
  .bubble .meta {
    display: flex;
    align-items: center;
    gap: 3px;
    justify-content: flex-end;
    font-size: 0.62rem;
    color: #00000073;
    margin-top: 2px;
    white-space: nowrap;
  }
  .bubble .ticks { color: #00000073; }
  .bubble .ticks.read { color: var(--wa-tick-read); }
  .bubble a { color: #039be5; text-decoration: underline; word-break: break-all; }
  .bubble.patient {
    align-self: flex-end;
    background: var(--wa-out-bubble);
    border-top-right-radius: 0;
  }
  .bubble.bot,
  .bubble.human_agent {
    align-self: flex-start;
    background: var(--wa-in-bubble);
    border-top-left-radius: 0;
  }
  .bubble.human_agent .meta::before {
    content: "Equipo GRIP · ";
    color: var(--accent);
    font-weight: 600;
  }
  .bubble.system {
    align-self: center;
    background: #d9edf9dd;
    color: #4a5568;
    font-style: italic;
    font-size: 0.7rem;
    box-shadow: none;
  }
  .typing-bubble {
    align-self: flex-start;
    background: var(--wa-in-bubble);
    border-top-left-radius: 0;
    padding: 9px 12px;
    border-radius: 8px;
    box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
    display: inline-flex;
    gap: 3px;
    align-items: center;
  }
  .typing-bubble span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #9aa0a6;
    display: inline-block;
    animation: wa-typing 1.1s infinite ease-in-out;
  }
  .typing-bubble span:nth-child(2) { animation-delay: 0.15s; }
  .typing-bubble span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes wa-typing {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-3px); opacity: 1; }
  }

  .composer {
    display: flex;
    gap: 8px;
    padding: 8px 10px;
    background: var(--wa-panel);
    flex-shrink: 0;
    align-items: center;
  }
  .composer input {
    flex: 1;
    padding: 9px 14px;
    border-radius: 20px;
    border: none;
    font-size: 0.85rem;
    background: #fff;
  }
  .composer input:focus { outline: none; }
  .composer button {
    background: var(--wa-header);
    color: white;
    border: none;
    border-radius: 50%;
    width: 36px;
    height: 36px;
    cursor: pointer;
    font-size: 0.95rem;
    flex-shrink: 0;
  }
  .composer button:disabled { opacity: 0.5; cursor: default; }

  /* --- inbox pane (agent side — internal tool, not WhatsApp-styled) --- */
  .inbox-list {
    width: 300px;
    border-right: 1px solid var(--border);
    background: var(--panel);
    overflow-y: auto;
  }
  .inbox-item {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .inbox-item:hover { background: #f7f8fa; }
  .inbox-item.selected { background: #eef6f4; }
  .inbox-item .phone { font-weight: 600; font-size: 0.85rem; }
  .inbox-item .preview {
    font-size: 0.78rem;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .badge {
    display: inline-block;
    font-size: 0.65rem;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 10px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .badge.WAITING_FOR_HUMAN { background: #fdecea; color: var(--danger); }
  .badge.HUMAN_ACTIVE { background: #e6f4ea; color: #1e7e34; }
  .badge.priority-CRITICAL { background: var(--danger); color: white; animation: badge-pulse 1.4s infinite; }
  @keyframes badge-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(192, 57, 41, 0.55); }
    50% { box-shadow: 0 0 0 5px rgba(192, 57, 41, 0); }
  }

  .alarm-toggle {
    border: 1px solid rgba(255, 255, 255, 0.5);
    background: rgba(255, 255, 255, 0.12);
    color: white;
    border-radius: 20px;
    padding: 6px 12px;
    font-size: 0.75rem;
    cursor: pointer;
  }
  .alarm-toggle.on { background: #fff; color: var(--accent); font-weight: 600; }

  .critical-banner {
    background: var(--danger);
    color: white;
    padding: 10px 16px;
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 0.85rem;
    font-weight: 600;
  }
  .critical-banner.visible { display: flex; }
  .critical-banner button {
    background: white;
    color: var(--danger);
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
  }
  .badge.priority-HIGH { background: var(--warn); color: white; }
  .badge.priority-MEDIUM { background: #d0d7de; color: #333; }
  .badge.priority-LOW { background: #eee; color: #666; }

  .inbox-detail {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .inbox-detail-header {
    padding: 10px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .inbox-detail-header .title {
    font-weight: 600;
    font-size: 0.95rem;
  }
  .inbox-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .inbox-actions button {
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
    font-size: 0.78rem;
  }
  .inbox-actions button.primary { background: var(--accent); color: white; border-color: var(--accent); }
  .inbox-actions button:disabled { opacity: 0.5; cursor: default; }
  .inbox-detail .chat-scroll {
    background: #fafbfc;
  }
  .inbox-detail .bubble {
    box-shadow: none;
    border-radius: 10px;
  }
  .inbox-detail .bubble.patient { background: var(--patient-bubble); }
  .inbox-detail .bubble.bot { background: var(--bot); }
  .inbox-detail .bubble.human_agent { background: var(--agent-bubble); }
  .inbox-detail .bubble .meta::before { content: none; }
  .inbox-detail .composer {
    background: var(--panel);
    border-top: 1px solid var(--border);
  }
  .inbox-detail .composer input {
    border: 1px solid var(--border);
    border-radius: 20px;
  }
  .inbox-detail .composer button {
    background: var(--accent);
    border-radius: 20px;
    width: auto;
    padding: 0 18px;
  }
  .empty-state {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 0.9rem;
    padding: 20px;
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <div>GRIP — Simulador de conversación</div>
  <div class="sub">sin Twilio, sin costo — patient chat + agent inbox</div>
  <button id="alarm-toggle-btn" class="alarm-toggle" title="Activar sonido para casos urgentes">
    🔕 Activar alertas de sonido
  </button>
</header>
<div id="critical-banner" class="critical-banner">
  <span id="critical-banner-text">⚠️ Nueva conversación urgente esperando a un agente</span>
  <button id="critical-banner-mute">Silenciar</button>
</div>

<div class="layout">
  <!-- LEFT: patient side, styled as a WhatsApp phone screen -->
  <section class="pane pane-left">
    <div class="sim-controls">
      <div style="flex:1">
        <label>Número simulado (paciente)</label>
        <input id="patient-phone" placeholder="Tu número simulado" />
      </div>
      <button id="new-patient-btn" title="Simular un paciente distinto">Nuevo paciente</button>
      <button id="test-reminder-btn" title="Crea una cita de prueba mañana y envía el recordatorio ahora mismo">Probar recordatorio</button>
    </div>

    <div class="phone-frame">
      <div class="phone-screen">
        <div class="phone-notch"></div>
        <div class="wa-status-bar"></div>
        <div class="wa-header">
          <span class="back-arrow">‹</span>
          <div class="wa-avatar">G</div>
          <div class="who">
            <div class="name">GRIP</div>
            <div class="status" id="wa-status">en línea</div>
          </div>
          <div class="icons">
            <span>📹</span>
            <span>📞</span>
            <span>⋮</span>
          </div>
        </div>
        <div class="chat-scroll" id="patient-chat"></div>
        <div class="composer">
          <input id="patient-input" placeholder="Mensaje" />
          <button id="patient-send-btn" title="Enviar">➤</button>
        </div>
      </div>
    </div>
  </section>

  <!-- RIGHT: agent inbox (internal tool — not meant to look like WhatsApp) -->
  <section class="pane pane-right">
    <div class="inbox-list" id="inbox-list">
      <div class="pane-title">Bandeja del agente</div>
    </div>
    <div class="inbox-detail">
      <div id="inbox-detail-content" class="empty-state">Selecciona una conversación de la izquierda.</div>
    </div>
  </section>
</div>

<script>
const TENANT_SLUG = "grip";
// A believable minimum "thinking" delay for the bot side, so a reply that
// the backend actually returns in ~50ms doesn't feel instant/robotic. Real
// Twilio + Gemini round-trips land around this range anyway.
const MIN_BOT_DELAY_MS = 900;

// ---------- utilities ----------
function randomPhone() {
  const n = Math.floor(1000000 + Math.random() * 8999999);
  return "+1555" + n;
}

function getOrInitPatientPhone() {
  let phone = localStorage.getItem("simulator_patient_phone");
  if (!phone) {
    phone = randomPhone();
    localStorage.setItem("simulator_patient_phone", phone);
  }
  return phone;
}

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text == null ? "" : text;
  return div.innerHTML;
}

// Escapes the text first (so a patient can't inject markup), then turns
// any http(s) URL into a real clickable link — this is what lets a Google
// Maps link the bot sends actually open the app/browser on tap, instead
// of sitting there as text the person has to copy and paste.
function linkify(text) {
  const escaped = escapeHtml(text);
  return escaped.replace(/(https?:\/\/[^\s<]+)/g, (url) => {
    // Trim common trailing punctuation that isn't part of the URL (a
    // period ending the sentence, a closing parenthesis, etc.).
    const trailingMatch = url.match(/[),.!?]+$/);
    const trailing = trailingMatch ? trailingMatch[0] : "";
    const href = trailing ? url.slice(0, -trailing.length) : url;
    return `<a href="${href}" target="_blank" rel="noopener noreferrer">${href}</a>${trailing}`;
  });
}

function formatTime(iso) {
  try {
    return new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  } catch (e) {
    return "";
  }
}

function sleep(ms) {
  return new Promise((resolve) => setTimeout(resolve, ms));
}

async function api(path, options) {
  const res = await fetch(path, options);
  if (!res.ok) {
    let detail = res.statusText;
    try {
      const body = await res.json();
      detail = body.detail || detail;
    } catch (e) {}
    throw new Error(detail);
  }
  if (res.status === 204) return null;
  return res.json();
}

// ================= PATIENT SIDE (WhatsApp look-alike) =================

const patientPhoneInput = document.getElementById("patient-phone");
const patientChatEl = document.getElementById("patient-chat");
const patientInputEl = document.getElementById("patient-input");
const patientSendBtn = document.getElementById("patient-send-btn");
const newPatientBtn = document.getElementById("new-patient-btn");
const waStatusEl = document.getElementById("wa-status");

let currentPatientPhone = getOrInitPatientPhone();
patientPhoneInput.value = currentPatientPhone;

function renderWhatsAppMessages(container, messages, { keepTyping } = {}) {
  const typingEl = keepTyping ? container.querySelector(".typing-row") : null;
  container.innerHTML = "";
  for (const m of messages) {
    const bubble = document.createElement("div");
    bubble.className = "bubble " + m.sender;
    const isOutgoing = m.sender === "patient";
    let ticks = "";
    if (isOutgoing) {
      // Every patient message shown here was already answered by the bot
      // (or is currently awaiting a reply) — good enough for a demo to
      // just show it as "read" once there's any later message.
      ticks = `<span class="ticks read">✓✓</span>`;
    }
    bubble.innerHTML = `${linkify(m.body)}<span class="meta">${m.intent ? escapeHtml(m.intent) + " · " : ""}${formatTime(m.created_at)} ${ticks}</span>`;
    container.appendChild(bubble);
  }
  if (typingEl) container.appendChild(typingEl);
  container.scrollTop = container.scrollHeight;
}

function showTypingIndicator(container) {
  const row = document.createElement("div");
  row.className = "typing-row";
  row.innerHTML = `<div class="typing-bubble"><span></span><span></span><span></span></div>`;
  container.appendChild(row);
  container.scrollTop = container.scrollHeight;
  return row;
}

async function refreshPatientChat() {
  try {
    const messages = await api(`/simulator/conversations/by-phone/${TENANT_SLUG}/${encodeURIComponent(currentPatientPhone)}/messages`);
    renderWhatsAppMessages(patientChatEl, messages);
  } catch (e) {
    // Contact may not exist yet — that's fine, just show nothing.
  }
}

async function sendPatientMessage() {
  const body = patientInputEl.value.trim();
  if (!body) return;
  patientSendBtn.disabled = true;
  patientInputEl.value = "";

  // Optimistic bubble so the send feels instant, then a typing indicator
  // while the real request (safety/intent/Gemini) is in flight.
  const optimistic = document.createElement("div");
  optimistic.className = "bubble patient";
  optimistic.innerHTML = `${escapeHtml(body)}<span class="meta">${formatTime(new Date().toISOString())} <span class="ticks">✓✓</span></span>`;
  patientChatEl.appendChild(optimistic);
  patientChatEl.scrollTop = patientChatEl.scrollHeight;

  waStatusEl.textContent = "escribiendo...";
  const typingRow = showTypingIndicator(patientChatEl);

  try {
    const [result] = await Promise.all([
      api("/simulator/message", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ tenant_slug: TENANT_SLUG, phone: currentPatientPhone, body }),
      }),
      sleep(MIN_BOT_DELAY_MS),
    ]);
    typingRow.remove();
    waStatusEl.textContent = result.awaiting_human ? "esperando al equipo" : "en línea";
    await refreshPatientChat();
    await refreshInboxList();
  } catch (e) {
    typingRow.remove();
    waStatusEl.textContent = "en línea";
    alert("Error enviando mensaje: " + e.message);
  } finally {
    patientSendBtn.disabled = false;
  }
}

patientSendBtn.addEventListener("click", sendPatientMessage);
patientInputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendPatientMessage();
});

patientPhoneInput.addEventListener("change", () => {
  currentPatientPhone = patientPhoneInput.value.trim() || getOrInitPatientPhone();
  localStorage.setItem("simulator_patient_phone", currentPatientPhone);
  waStatusEl.textContent = "en línea";
  refreshPatientChat();
});

const testReminderBtn = document.getElementById("test-reminder-btn");
testReminderBtn.addEventListener("click", async () => {
  testReminderBtn.disabled = true;
  try {
    const result = await api("/simulator/appointments/test-reminder", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tenant_slug: TENANT_SLUG, phone: currentPatientPhone }),
    });
    await refreshPatientChat();
    await refreshInboxList();
    const when = new Date(result.scheduled_at).toLocaleString("es-DO", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
    alert(`Recordatorio de prueba enviado a ${currentPatientPhone}.\nCita de prueba creada para: ${when}.\n\nAhora responde en el chat de la izquierda (por ejemplo "necesito cancelar" o "sí, ahí estaré") para ver cómo reacciona el sistema.`);
  } catch (e) {
    alert("Error creando el recordatorio de prueba: " + e.message);
  } finally {
    testReminderBtn.disabled = false;
  }
});

newPatientBtn.addEventListener("click", () => {
  currentPatientPhone = randomPhone();
  localStorage.setItem("simulator_patient_phone", currentPatientPhone);
  patientPhoneInput.value = currentPatientPhone;
  waStatusEl.textContent = "en línea";
  patientChatEl.innerHTML = "";
});

// ================= AGENT INBOX SIDE (internal tool) =================

const inboxListEl = document.getElementById("inbox-list");
const inboxDetailEl = document.getElementById("inbox-detail-content");
let selectedConversationId = null;
let lastConversations = [];

// A fixed "logged in agent" name for this simulator — good enough for a demo.
const AGENT_NAME = "secretaria_1";

// ================= URGENT-CASE ALARM =================
// Browsers block audio until the person interacts with the page at least
// once, so the "Activar alertas de sonido" button both unlocks that and
// doubles as a clear on/off control the secretary can see.
const alarmToggleBtn = document.getElementById("alarm-toggle-btn");
const criticalBanner = document.getElementById("critical-banner");
const criticalBannerText = document.getElementById("critical-banner-text");
const criticalBannerMuteBtn = document.getElementById("critical-banner-mute");

let alarmAudioCtx = null;
let alarmEnabled = localStorage.getItem("simulator_alarm_enabled") === "1";
let alarmIntervalId = null;
// Conversation ids the secretary has already been alerted about, so
// re-polling every 3s doesn't re-trigger the chime for the same case —
// only claiming it (or explicitly silencing) clears an entry.
const acknowledgedCriticalIds = new Set();

function setAlarmButtonState() {
  alarmToggleBtn.textContent = alarmEnabled ? "🔔 Alertas de sonido activadas" : "🔕 Activar alertas de sonido";
  alarmToggleBtn.classList.toggle("on", alarmEnabled);
}
setAlarmButtonState();

function playChimeOnce() {
  if (!alarmAudioCtx) return;
  const now = alarmAudioCtx.currentTime;
  // Two-tone "urgent" chime rather than a single beep, so it reads as an
  // alarm rather than a generic notification sound.
  [880, 660].forEach((freq, i) => {
    const osc = alarmAudioCtx.createOscillator();
    const gain = alarmAudioCtx.createGain();
    osc.type = "sine";
    osc.frequency.value = freq;
    gain.gain.value = 0.0001;
    osc.connect(gain);
    gain.connect(alarmAudioCtx.destination);
    const start = now + i * 0.22;
    gain.gain.exponentialRampToValueAtTime(0.2, start + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.35);
    osc.start(start);
    osc.stop(start + 0.4);
  });
}

function startAlarmLoop(bannerText) {
  criticalBannerText.textContent = bannerText;
  criticalBanner.classList.add("visible");
  if (alarmIntervalId) return; // already sounding
  if (alarmEnabled) {
    playChimeOnce();
    alarmIntervalId = setInterval(playChimeOnce, 2500);
  }
}

function stopAlarmLoop() {
  criticalBanner.classList.remove("visible");
  if (alarmIntervalId) {
    clearInterval(alarmIntervalId);
    alarmIntervalId = null;
  }
}

alarmToggleBtn.addEventListener("click", () => {
  if (!alarmAudioCtx) {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    alarmAudioCtx = new AudioCtx();
  }
  alarmAudioCtx.resume();
  alarmEnabled = !alarmEnabled;
  localStorage.setItem("simulator_alarm_enabled", alarmEnabled ? "1" : "0");
  setAlarmButtonState();
  if (alarmEnabled) {
    playChimeOnce(); // confirms audibly that it's on
  } else {
    stopAlarmLoop();
  }
});

criticalBannerMuteBtn.addEventListener("click", () => {
  // Silences the current alarm without requiring the case to be claimed —
  // the secretary may just be acknowledging it while stepping away, not
  // handling it yet. It reappears if ANOTHER new critical case comes in.
  for (const conv of lastConversations) {
    if (conv.status === "WAITING_FOR_HUMAN" && conv.handoff_priority === "CRITICAL") {
      acknowledgedCriticalIds.add(conv.id);
    }
  }
  stopAlarmLoop();
});

function checkForNewCriticalCases(conversations) {
  const currentCriticalWaiting = conversations.filter(
    (c) => c.status === "WAITING_FOR_HUMAN" && c.handoff_priority === "CRITICAL"
  );
  const unacknowledged = currentCriticalWaiting.filter((c) => !acknowledgedCriticalIds.has(c.id));

  if (unacknowledged.length > 0) {
    const label =
      unacknowledged.length === 1
        ? `⚠️ Caso urgente esperando: ${unacknowledged[0].contact_name || unacknowledged[0].contact_phone}`
        : `⚠️ ${unacknowledged.length} casos urgentes esperando a un agente`;
    startAlarmLoop(label);
  } else {
    stopAlarmLoop();
  }

  // Once a critical case stops being WAITING_FOR_HUMAN (claimed, or
  // otherwise moved on), drop it from the acknowledged set so a FUTURE
  // critical case can alarm again even if it happens to reuse... nothing
  // reuses ids, but this keeps the set from growing forever.
  const stillWaitingIds = new Set(currentCriticalWaiting.map((c) => c.id));
  for (const id of Array.from(acknowledgedCriticalIds)) {
    if (!stillWaitingIds.has(id)) acknowledgedCriticalIds.delete(id);
  }
}

function renderMessages(container, messages) {
  container.innerHTML = "";
  for (const m of messages) {
    const bubble = document.createElement("div");
    bubble.className = "bubble " + m.sender;
    const label = m.sender === "patient" ? "Paciente" : m.sender === "bot" ? "Bot" : m.sender === "human_agent" ? "Agente" : "Sistema";
    bubble.innerHTML = linkify(m.body) + `<span class="meta">${label} · ${formatTime(m.created_at)}${m.intent ? " · " + escapeHtml(m.intent) : ""}</span>`;
    container.appendChild(bubble);
  }
  container.scrollTop = container.scrollHeight;
}

// Display text only — the underlying status/priority values (and the CSS
// classes below) stay in English because they're the same enum values the
// backend and the state machine use (app.models.conversation.ConversationStatus,
// handoff_priority). Only what the agent reads on screen is translated.
const STATUS_LABELS_ES = {
  BOT_ACTIVE: "Bot activo",
  WAITING_FOR_PATIENT: "Esperando paciente",
  WAITING_FOR_HUMAN: "Esperando agente",
  HUMAN_ACTIVE: "Agente activo",
  HUMAN_RESOLVED: "Resuelto",
  BOT_RESUMED: "Bot reanudado",
  CLOSED: "Cerrado",
};

const PRIORITY_LABELS_ES = {
  CRITICAL: "Crítica",
  HIGH: "Alta",
  MEDIUM: "Media",
  LOW: "Baja",
};

function conversationStatusBadge(conv) {
  const statusLabel = STATUS_LABELS_ES[conv.status] || conv.status.replace(/_/g, " ");
  let html = `<span class="badge ${conv.status}">${statusLabel}</span>`;
  if (conv.handoff_priority) {
    const priorityLabel = PRIORITY_LABELS_ES[conv.handoff_priority] || conv.handoff_priority;
    html += `<span class="badge priority-${conv.handoff_priority}">${priorityLabel}</span>`;
  }
  return html;
}

function renderInboxList(conversations) {
  inboxListEl.innerHTML = '<div class="pane-title">Bandeja del agente</div>';
  if (conversations.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty-state";
    empty.textContent = "No hay conversaciones en espera ni activas.";
    inboxListEl.appendChild(empty);
    return;
  }
  for (const conv of conversations) {
    const item = document.createElement("div");
    item.className = "inbox-item" + (conv.id === selectedConversationId ? " selected" : "");
    item.innerHTML = `
      <div class="phone">${escapeHtml(conv.contact_name || conv.contact_phone)} ${conversationStatusBadge(conv)}</div>
      <div class="preview">${escapeHtml(conv.last_message_preview || "")}</div>
    `;
    item.addEventListener("click", () => selectConversation(conv.id));
    inboxListEl.appendChild(item);
  }
}

async function refreshInboxList() {
  try {
    lastConversations = await api(`/simulator/conversations?tenant_slug=${TENANT_SLUG}`);
    renderInboxList(lastConversations);
    checkForNewCriticalCases(lastConversations);
    if (selectedConversationId) {
      await refreshInboxDetail();
    }
  } catch (e) {
    console.error(e);
  }
}

async function selectConversation(conversationId) {
  selectedConversationId = conversationId;
  renderInboxList(lastConversations);
  await refreshInboxDetail();
}

async function refreshInboxDetail() {
  if (!selectedConversationId) return;
  const conv = lastConversations.find((c) => c.id === selectedConversationId);
  if (!conv) {
    inboxDetailEl.className = "empty-state";
    inboxDetailEl.textContent = "Esta conversación ya no está en la bandeja (fue resuelta o vuelta al bot).";
    return;
  }

  let messages = [];
  try {
    messages = await api(`/simulator/conversations/${conv.id}/messages`);
  } catch (e) {}

  const canClaim = conv.status === "WAITING_FOR_HUMAN";
  const canReply = conv.status === "HUMAN_ACTIVE";
  const canResolve = conv.status === "HUMAN_ACTIVE";
  const canReturnToBot = conv.status === "HUMAN_RESOLVED";

  inboxDetailEl.className = "";
  inboxDetailEl.innerHTML = `
    <div class="inbox-detail-header">
      <div class="title">${escapeHtml(conv.contact_name || conv.contact_phone)} ${conversationStatusBadge(conv)}</div>
      <div class="inbox-actions">
        <button id="btn-claim" ${canClaim ? "" : "disabled"}>Tomar conversación</button>
        <button id="btn-resolve" ${canResolve ? "" : "disabled"}>Marcar resuelto</button>
        <button id="btn-return" ${canReturnToBot ? "" : "disabled"}>Devolver al bot</button>
      </div>
    </div>
    <div class="chat-scroll" id="inbox-chat"></div>
    <div class="composer">
      <input id="agent-input" placeholder="${canReply ? 'Responder al paciente...' : 'Toma la conversación para poder responder'}" ${canReply ? "" : "disabled"} />
      <button id="agent-send-btn" ${canReply ? "" : "disabled"}>Enviar</button>
    </div>
  `;

  renderMessages(document.getElementById("inbox-chat"), messages);

  document.getElementById("btn-claim").addEventListener("click", async () => {
    try {
      await api(`/simulator/conversations/${conv.id}/claim`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ agent_name: AGENT_NAME }),
      });
      await refreshInboxList();
    } catch (e) {
      alert("Error: " + e.message);
    }
  });

  document.getElementById("btn-resolve").addEventListener("click", async () => {
    try {
      await api(`/simulator/conversations/${conv.id}/resolve`, { method: "POST" });
      await refreshInboxList();
    } catch (e) {
      alert("Error: " + e.message);
    }
  });

  document.getElementById("btn-return").addEventListener("click", async () => {
    try {
      await api(`/simulator/conversations/${conv.id}/return-to-bot`, { method: "POST" });
      selectedConversationId = null;
      await refreshInboxList();
    } catch (e) {
      alert("Error: " + e.message);
    }
  });

  const agentInput = document.getElementById("agent-input");
  const agentSendBtn = document.getElementById("agent-send-btn");

  async function sendAgentReply() {
    const body = agentInput.value.trim();
    if (!body) return;
    agentSendBtn.disabled = true;
    try {
      await api(`/simulator/conversations/${conv.id}/reply`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ body }),
      });
      agentInput.value = "";
      await refreshInboxDetail();
      await refreshPatientChat();
    } catch (e) {
      alert("Error: " + e.message);
    } finally {
      agentSendBtn.disabled = false;
    }
  }

  if (canReply) {
    agentSendBtn.addEventListener("click", sendAgentReply);
    agentInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendAgentReply();
    });
  }
}

// ================= polling =================

refreshPatientChat();
refreshInboxList();
setInterval(refreshPatientChat, 3000);
setInterval(refreshInboxList, 3000);
</script>
